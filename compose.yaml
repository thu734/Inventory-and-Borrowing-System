name: borrowbase-l5-04

services:
  app:
    image: borrowbase-l5-04-app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: borrowbase-l5-04-app
    platform: linux/amd64
    environment:
      NODE_ENV: development
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.docker}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}?schema=public
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET in .env.docker}
    ports:
      - "127.0.0.1:13004:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    container_name: borrowbase-l5-04-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: borrowbase-l5-04-maintenance:local
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    platform: linux/amd64
    profiles: ["maintenance"]
    container_name: borrowbase-l5-04-maintenance
    entrypoint: ["npm", "run"]
    command: ["db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}?schema=public
      SEED_BORROWER_PASSWORD: ${SEED_BORROWER_PASSWORD:-}
      SEED_CUSTODIAN_PASSWORD: ${SEED_CUSTODIAN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
    name: borrowbase-l5-04-postgres-data
