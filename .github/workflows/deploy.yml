
name: Deploy demo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Previous released SHA for rollback/roll-forward (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: borrowbase-demo-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Verify release
    uses: ./.github/workflows/pr-ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy BorrowBase
    needs: test
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REQUESTED_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate configuration and release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$PROJECT_ID" == "cpe334-borrowbase" ]]
          [[ "$REGION" == "asia-southeast1" ]]

          if [[ -n "$REQUESTED_SHA" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
            RELEASE_SHA="$REQUESTED_SHA"
            BUILD_NEW=false
          else
            RELEASE_SHA="$GITHUB_SHA"
            BUILD_NEW=true
          fi

          PREFIX="$REGION-docker.pkg.dev/$PROJECT_ID/borrowbase"

          {
            echo "RELEASE_SHA=$RELEASE_SHA"
            echo "BUILD_NEW=$BUILD_NEW"
            echo "APP_IMAGE=$PREFIX/borrowbase:$RELEASE_SHA"
            echo "MAINT_IMAGE=$PREFIX/borrowbase-maintenance:$RELEASE_SHA"
          } >> "$GITHUB_ENV"

      - name: Check out selected release
        shell: bash
        run: git checkout --detach "$RELEASE_SHA"

      - name: Build application image
        if: env.BUILD_NEW == 'true'
        shell: bash
        run: |
          docker build \
            --platform linux/amd64 \
            --target runtime \
            -t "$APP_IMAGE" .

      - name: Build maintenance image
        if: env.BUILD_NEW == 'true'
        shell: bash
        run: |
          docker build \
            --platform linux/amd64 \
            --target build \
            -t "$MAINT_IMAGE" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        if: env.BUILD_NEW == 'true'
        shell: bash
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" --quiet

      - name: Push Docker images
        if: env.BUILD_NEW == 'true'
        shell: bash
        run: |
          docker push "$APP_IMAGE"
          docker push "$MAINT_IMAGE"

      - name: Refresh authentication before release
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Run migration and deploy
        shell: bash
        env:
          DRY_RUN: "0"
        run: bash deploy/release.sh "$RELEASE_SHA"

      - name: Smoke test public URL
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_URL="$(gcloud run services describe borrowbase \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(status.url)')"

          python3 deploy/smoke_test.py "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Record deployment summary
        shell: bash
        run: |
          set -euo pipefail

          APP_DIGEST="$(gcloud artifacts docker images describe "$APP_IMAGE" \
            --project="$PROJECT_ID" \
            --format='value(image_summary.fully_qualified_digest)')"

          REVISION="$(gcloud run services describe borrowbase \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')"

          {
            echo "## BorrowBase Demo Deployment"
            echo
            echo "- Source SHA: $RELEASE_SHA"
            echo "- Application image: $APP_IMAGE"
            echo "- Application digest: $APP_DIGEST"
            echo "- Cloud Run revision: $REVISION"
            echo "- Service URL: $SERVICE_URL"
            echo "- Smoke test: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
